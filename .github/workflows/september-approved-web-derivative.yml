name: September approved Web image derivative

on:
  pull_request:
    paths:
      - .github/workflows/september-approved-web-derivative.yml
      - scripts/render-approved-web-review.mjs
      - scripts/test-render-approved-web-review.mjs
  workflow_dispatch:

concurrency:
  group: september-approved-web-derivative
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render-approved-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: df503f170c26c39c602e2cde82de232de52d3f87
      SOURCE_PATH: review/2026-09/v46-central-michigan-promo/calendar.html
      SOURCE_SHA256: 63b4f12cfff90edee909e62e0b34432be81e0c5877c056f5fd0c56cd5d862731
      DEST: review/2026-09/v47
    steps:
      - name: Check out approved review and export code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts
            review/2026-09/v46-central-michigan-promo
            review/2026-09/v47

      - name: Check out exact approved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: approved-source
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: review/2026-09/v46-central-michigan-promo

      - name: Use Node.js with native WebSocket support
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate export rules without launching a browser
        run: node --test scripts/test-render-approved-web-review.mjs

      - name: Read exact approved HTML from its immutable commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${DEST}"
          test "$(git -C approved-source rev-parse HEAD)" = "${SOURCE_COMMIT}"
          git -C approved-source show "${SOURCE_COMMIT}:${SOURCE_PATH}" > "${RUNNER_TEMP}/approved-calendar.html"
          echo "${SOURCE_SHA256}  ${RUNNER_TEMP}/approved-calendar.html" | sha256sum --check --strict
          echo "${SOURCE_SHA256}  ${SOURCE_PATH}" | sha256sum --check --strict

      - name: Render and validate image derivatives on isolated Linux
        shell: bash
        run: |
          set -euo pipefail
          # Rendering must run without any repository credential in env or git config.
          test -z "${GITHUB_TOKEN:-}${PREVIEW_DEPLOY_TOKEN:-}"
          for repo in . approved-source; do
            if git -C "${repo}" config --local --name-only --get-regexp '^(http\..*extraheader|credential\..*|url\..*)$'; then
              echo "Repository credential persisted in ${repo}." >&2; exit 1
            fi
          done
          node scripts/render-approved-web-review.mjs "${RUNNER_TEMP}/approved-calendar.html" "${DEST}" "${SOURCE_SHA256}"
          if pgrep -u "$(id -u)" -l chrom; then
            echo "Chrome processes outlived the export." >&2; exit 1
          fi

      - name: Publish a new immutable Web review candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          PREVIEW_DEPLOY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIEW_DEPLOY_TOKEN:-}"
          echo "${SOURCE_SHA256}  ${DEST}/calendar.html" | sha256sum --check --strict
          test -s "${DEST}/calendar.png"
          test -s "${DEST}/calendar.pdf"
          git add "${DEST}/calendar.html" "${DEST}/calendar.png" "${DEST}/calendar.pdf"
          mapfile -t CHANGED < <(git diff --cached --name-only)
          test "${#CHANGED[@]}" -eq 3
          for changed in "${CHANGED[@]}"; do
            case "${changed}" in
              "${DEST}/calendar.html"|"${DEST}/calendar.png"|"${DEST}/calendar.pdf") ;;
              *) echo "Unexpected change: ${changed}" >&2; exit 1 ;;
            esac
          done
          git config user.name "bougies-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit --no-verify -m "Publish approved September Web v47 derivative [automated]"
          # Pass the token through git's environment only: never argv or .git/config.
          AUTH="$(printf 'x-access-token:%s' "${PREVIEW_DEPLOY_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}" \
            git -c core.hooksPath=/dev/null push --no-verify https://github.com/sotadatos/bougies-calendar-preview.git HEAD:main

      - name: Record candidate evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Approved September Web candidate"
            echo "- Source commit: ${SOURCE_COMMIT}"
            echo "- Source HTML SHA-256: ${SOURCE_SHA256}"
            echo "- New review: ${DEST}"
            if [ -f "${DEST}/calendar.png" ]; then
              echo "- PNG SHA-256: $(sha256sum "${DEST}/calendar.png" | cut -d ' ' -f1)"
              echo "- PDF SHA-256: $(sha256sum "${DEST}/calendar.pdf" | cut -d ' ' -f1)"
            fi
            echo "- Web production pointer: unchanged"
          } >> "${GITHUB_STEP_SUMMARY}"
